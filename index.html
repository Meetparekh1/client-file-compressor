<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="100% client-side file compressor with ~99% accuracy target sizing. Compress Images, PDFs, and Word documents directly inside your browser without uploading to any server with Local File Engine." />
    <title>Local File Engine - In-Browser Precision File Compressor</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('docukit-ui-mode');
          if (mode === 'classic') {
            document.documentElement.classList.add('theme-classic');
          } else {
            document.documentElement.classList.add('theme-glassy');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-glassy');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
